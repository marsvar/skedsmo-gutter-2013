<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skedsmo Fotball – Økter</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://skedsmofk.no/favicons/favicon-32.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { nff: { blue: '#003087', red: '#c6180e', gold: '#f5a623' }, skedsmo: { red: '#c6180e', dark: '#0b0b0b', light: '#e1e8f2', gray: '#444444' } } } }
    }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<header class="bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center gap-4">
    <img src="https://skedsmofk.no/images/logo.png" alt="Skedsmo FK logo" class="w-12 h-12 object-contain" />
    <div>
      <h1 class="text-xl font-bold text-skedsmo-dark">Skedsmo Fotball</h1>
      <p class="text-sm text-gray-500">Fase 2 – Økter med filter og søk</p>
    </div>
  </div>
</header>
<nav class="bg-skedsmo-light border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4 py-2 flex gap-5 text-sm overflow-x-auto">
    <a data-topnav href="index.html" class="top-nav-link">Oversikt (eksisterende)</a>
    <a data-topnav href="arsplan.html" class="top-nav-link">Årsplan</a>
    <a data-topnav href="kalender.html" class="top-nav-link">Kalender</a>
    <a data-topnav href="okter.html" class="top-nav-link">Økter</a>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
  <div>
    <h2 class="text-2xl font-bold">Økter og tema</h2>
    <p class="text-sm text-gray-500 mt-1">Øvelser hentes fra <code>data/content.json</code> med enkle filtre (fase/aldersgruppe).</p>
  </div>

  <div class="bg-white border rounded-xl p-4 grid md:grid-cols-3 gap-4">
    <label class="text-sm">
      <span class="block mb-1 text-gray-600">Filter fase</span>
      <select id="phase-filter" class="w-full border rounded px-3 py-2">
        <option value="all">Alle</option>
      </select>
    </label>
    <label class="text-sm">
      <span class="block mb-1 text-gray-600">Filter alder</span>
      <select id="age-filter" class="w-full border rounded px-3 py-2">
        <option value="all">Alle</option>
        <option value="2013">2013-laget</option>
        <option value="13-16">13–16 år</option>
      </select>
    </label>
    <label class="text-sm">
      <span class="block mb-1 text-gray-600">Søk øvelse</span>
      <input id="exercise-search" type="search" placeholder="F.eks. situasjonsøvelse 24" class="w-full border rounded px-3 py-2" />
    </label>
  </div>

  <p id="exercise-count" class="text-sm text-gray-500"></p>
  <div id="exercise-list" class="space-y-3"></div>
</main>
<script src="assets/js/main.js"></script>
</body>
</html>
